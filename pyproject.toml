[project]
name = "metric-home-assistant"
version = "0.1.0"
description = "Home Assistant integration for Metric gas tank sensors"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.371",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.metric"]
known-third-party = ["homeassistant"]
force-sort-within-sections = true
combine-as-imports = true
